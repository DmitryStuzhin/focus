<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предпросмотр</title>
</head>
<body>
<p>Загружаем предпросмотр…</p>
<script>
 if (window.parent !== window) {
   const channel = new MessageChannel();
   channel.port1.onmessage = ({data}) => {
     channel.port1.close();
     if (typeof data !== 'string' || data.length > 110000) return;
     document.open();
     document.write(data);
     document.close();
   };
   window.parent.postMessage({type:'focus-preview-ready', id:location.hash.slice(1)}, '*', [channel.port2]);
 }
</script>
</body>
</html>
