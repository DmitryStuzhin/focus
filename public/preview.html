<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предпросмотр</title>
<style>
 :root { color-scheme: light dark; }
 body { margin: 0; background: Canvas; color: CanvasText; font: 14px/1.5 system-ui, sans-serif; }
 p { margin: 0; padding: 16px; }
</style>
</head>
<body>
<p role="status">Загружаем предпросмотр…</p>
<script>
 if (window.parent !== window) {
   const channel = new MessageChannel();
   channel.port1.onmessage = ({data}) => {
     channel.port1.close();
     if (typeof data !== 'string' || data.length > 110000) return;
     document.open();
     document.write(data);
     document.close();
   };
   window.parent.postMessage({type:'focus-preview-ready', id:location.hash.slice(1)}, '*', [channel.port2]);
 }
</script>
</body>
</html>
