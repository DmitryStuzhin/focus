name: Check Focus
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: focus-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n deploy/*.sh
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm test
      - run: npm run build
      - run: npm run validate
